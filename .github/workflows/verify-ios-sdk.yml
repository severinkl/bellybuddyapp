name: Verify iOS SDK (Xcode 26)

on:
  push:
    branches: [feat/ios-sdk-xcode-26]
    paths:
      - .github/workflows/verify-ios-sdk.yml
      - .github/workflows/deploy.yml

jobs:
  verify:
    name: Binary built with iOS 26 SDK?
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode + iPhoneOS SDK info
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo ""
          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-build-version
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks | grep -i iphoneos || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Stage example configs (no real secrets needed; no-codesign build)
        run: |
          cp env.example.json env.json
          cp ios/Runner/GoogleService-Info.example.plist ios/Runner/GoogleService-Info.plist

      - run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS .app (release, no codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=env.json

      - name: Assert LC_BUILD_VERSION sdk = 26.x
        run: |
          APP="build/ios/iphoneos/Runner.app/Runner"
          echo "=== binary ==="
          file "$APP"
          echo ""
          echo "=== LC_BUILD_VERSION (first 10 lines) ==="
          otool -l "$APP" | grep -A5 LC_BUILD_VERSION | head -10
          echo ""
          SDK=$(otool -l "$APP" | grep -A5 LC_BUILD_VERSION | grep -E '^\s*sdk\s' | head -1 | awk '{print $2}')
          echo "Detected SDK in Mach-O: $SDK"
          case "$SDK" in
            26.*)
              echo "::notice::Binary built against iOS 26 SDK — ITMS-90725 resolved."
              ;;
            *)
              echo "::error::Binary SDK is '$SDK', expected 26.x. Fix did not take effect."
              exit 1
              ;;
          esac
