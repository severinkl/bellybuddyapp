name: Deploy

# Deploys are started by workflow_dispatch: release.yml dispatches this
# workflow for every tag it creates, because a tag pushed with GITHUB_TOKEN
# never triggers `push` here. Release tags point at the
# `chore(release): x.y.z [skip ci]` commit, and GitHub skips push-triggered
# runs for [skip ci] commits, so re-pushing a release tag by hand starts no
# deploy either. To redeploy a release, run this workflow manually
# (workflow_dispatch) with the tag as the ref. The `push: tags` trigger only
# fires for a `v*` tag on a commit without [skip ci].
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  quality:
    name: Format & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create env.json
        run: cp env.example.json env.json
      - run: flutter pub get
      - name: Code generation
        run: dart run build_runner build
      - name: Check formatting
        run: |
          find lib test -name '*.dart' \
            ! -name '*.freezed.dart' \
            ! -name '*.g.dart' \
            -print0 | xargs -0 dart format --set-exit-if-changed
      - run: flutter analyze

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create env.json
        run: cp env.example.json env.json
      - run: flutter pub get
      - name: Code generation
        run: dart run build_runner build
      - run: flutter test --dart-define-from-file=env.json

  deploy-android:
    name: Build Android AAB
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create env.json
        run: echo "${{ secrets.ENV_JSON_BASE64 }}" | base64 --decode > env.json

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: Create key.properties
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            > android/key.properties

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Build AAB
        run: flutter build appbundle --release --dart-define-from-file=env.json --build-number=${{ github.run_number }} --split-debug-info=build/symbols --obfuscate

      - name: Upload Dart AOT symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: dart run sentry_dart_plugin

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bellybuddy.belly_buddy
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # Use `tracks:` (plural, non-deprecated). The previous `track:`
          # left the new `tracks:` input at its default of `production`,
          # so the action failed with "Precondition check failed" while
          # validating a non-existent production release.
          tracks: internal
          status: completed

  deploy-ios:
    name: Deploy iOS → TestFlight
    needs: [quality, test]
    # macos-26 bundles Xcode 26 (iOS 26 SDK). Required from 2026-04-28
    # when Apple rejects uploads built with iOS 18 SDK (ITMS-90725).
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The upgrade screen links to the App Store listing; with the placeholder
      # ID that link is dead and a hard-gated user cannot leave the screen.
      - name: Guard against placeholder App Store ID
        run: |
          id=$(perl -0ne "print \$1 if /iosAppStoreId\s*=\s*'([^']*)'/" lib/config/constants.dart)
          if [ -z "$id" ] || [ "$id" = "0000000000" ]; then
            echo "::error file=lib/config/constants.dart::AppConstants.iosAppStoreId is still the placeholder '${id:-<not found>}'. Set the real App Store ID before building an iOS release."
            exit 1
          fi
          echo "iosAppStoreId=$id"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create env.json
        run: echo "${{ secrets.ENV_JSON_BASE64 }}" | base64 --decode > env.json

      - name: Create GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Install Apple certificate and provisioning profile
        env:
          DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$DISTRIBUTION_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

      - name: Build IPA
        run: flutter build ipa --release --dart-define-from-file=env.json --export-options-plist=ios/ExportOptions.plist --build-number=${{ github.run_number }} --split-debug-info=build/symbols --obfuscate

      - name: Upload Dart AOT symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: dart run sentry_dart_plugin

      # xcodebuild -exportArchive names the IPA after the archive's primary
      # bundle CFBundleName. Resolve by glob so renames of the app display name
      # (e.g. CFBundleName = "Belly Buddy") don't break this step.
      - name: Resolve IPA path
        id: ipa
        run: echo "path=$(ls build/ios/ipa/*.ipa | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
