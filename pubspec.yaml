name: belly_buddy
description: "Belly Buddy - Dein Bauchgefühl Tracker"
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: ^3.11.1

dependencies:
  sentry_flutter: ^10.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.18.3

  # State management
  flutter_riverpod: ^3.5.0

  # RSS parsing and fetching
  xml: ^7.0.1
  http: ^1.6.0

  # Routing
  go_router: ^18.1.4

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  flutter_svg: ^2.5.0
  cached_network_image: ^4.0.7
  shimmer: ^4.0.0

  # URL launcher
  url_launcher: ^6.3.3

  # Functionality
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  intl: ^0.20.3
  uuid: ^4.6.0

  cupertino_icons: ^2.0.0
  flutter_native_splash: ^2.4.8
  crypto: ^3.0.8

  # Notifications
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

  # App version info
  package_info_plus: ^10.2.2
  # Vendored 2.0.12 with an AGP 9 built-in-Kotlin fix (see
  # third_party/in_app_review/android/build.gradle); back to ^2.0.13+ once
  # upstream migrates.
  in_app_review:
    path: third_party/in_app_review

dev_dependencies:
  sentry_dart_plugin: ^3.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  riverpod: ^3.5.0
  integration_test:
    sdk: flutter

  # Code generation
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app-icon.png"

flutter_native_splash:
  color: "#F9F7F4"
  image: assets/images/native-splash.png
  fullscreen: true
  android_12:
    color: "#F9F7F4"
    image: assets/images/app-icon-transparent.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mascot/
    - assets/images/icons/
    - assets/images/icons/needs/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: belly-buddy-fz
